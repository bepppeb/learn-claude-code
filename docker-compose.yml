services:
  # 参考实现（agents/s01-s12）
  ref:
    build:
      context: .
      network: host
    env_file: .env
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - ./agents:/workspace/agents:ro
      - ./skills:/workspace/skills:ro
      - ./data/ref:/workspace/data
    working_dir: /workspace
    entrypoint: ["python"]
    command: ["agents/s01_agent_loop.py"]

  # 你的实现（my-agent/agents/）
  my:
    build:
      context: .
      network: host
    env_file: .env
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - ./my-agent/agents:/workspace/agents:ro
      - ./skills:/workspace/skills:ro
      - ./data/my:/workspace/data
    working_dir: /workspace
    entrypoint: ["python"]
    command: ["agents/s01_agent_loop.py"]
